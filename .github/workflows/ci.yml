name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase for the release
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: Run all checks and compute the version without tagging or publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag-release.outputs.tag || steps.next-release.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release
        id: tag-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            printf 'Release tag must look like vX.Y.Z or vX.Y.Z-prerelease, got: %s\n' "$tag" >&2
            exit 1
          fi

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          release_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main; then
            printf 'Release commit %s is not reachable from origin/main\n' "$release_sha" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Compute next release
        id: next-release
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            printf 'Releases can only be started from main, got: %s\n' "$GITHUB_REF" >&2
            exit 1
          fi

          latest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ -z "$latest" ]; then
            printf 'No stable vX.Y.Z release tag found\n' >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) printf 'Unknown bump: %s\n' "$BUMP" >&2; exit 1 ;;
          esac
          tag="v${major}.${minor}.${patch}"

          if [ -z "$(git rev-list "${latest}..HEAD")" ]; then
            printf 'No commits since %s, nothing to release\n' "$latest" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            printf 'Tag %s already exists\n' "$tag" >&2
            exit 1
          fi

          mode="Releasing"
          if [ "$DRY_RUN" = "true" ]; then
            mode="Dry run, would release"
          fi
          printf '%s %s (%s + %s) at %s\n' "$mode" "$tag" "$latest" "$BUMP" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check Go version matches Dockerfile
        run: |
          mod_version="$(go mod edit -json | jq -r .Go)"
          image_version="$(sed -nE 's/^FROM golang:([0-9.]+)-alpine.*/\1/p' Dockerfile)"
          if [ "$mod_version" != "$image_version" ]; then
            printf 'go.mod uses Go %s but the Dockerfile builds with golang:%s; update the go line in go.mod\n' \
              "$mod_version" "$image_version" >&2
            exit 1
          fi

      - name: Check Go formatting
        run: |
          files="$(gofmt -l *.go)"
          if [ -n "$files" ]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet Go code
        run: go vet ./...

      - name: Test Go code
        run: go test ./...

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Test browser modules
        run: npm test

      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser flow
        run: npm run test:browser

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: one-time-note:test
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag:
    name: Create release tag
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    needs:
      - release-gate
      - go
      - frontend
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Push release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-gate.outputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$GITHUB_SHA"

  publish:
    name: Publish GHCR image
    if: >-
      !cancelled() && !failure() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    needs:
      - release-gate
      - go
      - frontend
      - container
      - tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},value=${{ needs.release-gate.outputs.tag }},enable=${{ needs.release-gate.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-gate.outputs.tag }},enable=${{ needs.release-gate.outputs.tag != '' && !contains(needs.release-gate.outputs.tag, '-') }}
            type=semver,pattern={{major}},value=${{ needs.release-gate.outputs.tag }},enable=${{ needs.release-gate.outputs.tag != '' && !contains(needs.release-gate.outputs.tag, '-') }}
            type=raw,value=latest,enable=${{ needs.release-gate.outputs.tag != '' && !contains(needs.release-gate.outputs.tag, '-') }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: push
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Create GitHub release
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.release-gate.outputs.tag != '' }}
    needs:
      - release-gate
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-gate.outputs.tag }}
        run: |
          prerelease=""
          case "$RELEASE_TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "$RELEASE_TAG" $prerelease
